          cat > app/src/main/java/com/btauto/BtStateReceiver.java <<'EOF'
          package com.btauto;

          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          // برنامه همیشه در پس‌زمینه نیست؛ این گیرنده با روشن/خاموش شدن بلوتوث سرویس را شروع یا متوقف می‌کند
          public class BtStateReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              String act = i.getAction();
              if (act == null) return;
              if (BluetoothAdapter.ACTION_STATE_CHANGED.equals(act)) {
                int s = i.getIntExtra(BluetoothAdapter.EXTRA_STATE, -1);
                if (s == BluetoothAdapter.STATE_TURNING_ON || s == BluetoothAdapter.STATE_ON) {
                  BtService.start(c);
                } else if (s == BluetoothAdapter.STATE_TURNING_OFF || s == BluetoothAdapter.STATE_OFF) {
                  c.stopService(new Intent(c, BtService.class));
                }
              } else if (BluetoothDevice.ACTION_ACL_CONNECTED.equals(act)) {
                // پشتیبان: اگر به هر دلیل سرویس اجرا نیست ولی بلوتوث روشن است
                if (!BtService.running) BtService.start(c);
              }
            }
          }
          EOF
          cat > app/src/main/java/com/btauto/BtService.java <<'EOF'
          package com.btauto;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.bluetooth.BluetoothA2dp;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothClass;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothHeadset;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.BluetoothSocket;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.ParcelUuid;
          import java.lang.reflect.Method;
          import java.util.HashSet;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;

          public class BtService extends Service {
            static final UUID SPP = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
            static volatile boolean running = false;
            BluetoothAdapter ad;
            volatile int gen = 0;
            volatile BluetoothProfile a2dp, hfp;
            final Map<String, BluetoothSocket> socks = new ConcurrentHashMap<>();

            // شروع سرویس: فقط اگر بلوتوث روشن (یا در حال روشن شدن) است و دستگاهی انتخاب شده
            static void start(Context c) {
              try {
                BluetoothAdapter a = BluetoothAdapter.getDefaultAdapter();
                if (a == null) return;
                int st = a.getState();
                if (st != BluetoothAdapter.STATE_ON && st != BluetoothAdapter.STATE_TURNING_ON) return;
                Set<String> sel = c.getSharedPreferences("bt", Context.MODE_PRIVATE).getStringSet("sel", new HashSet<String>());
                if (sel.isEmpty()) return;
                c.startForegroundService(new Intent(c, BtService.class));
              } catch (Throwable t) { }
            }

            // با خاموش شدن بلوتوث، سرویس بلافاصله بسته می‌شود (تنظیمات ذخیره‌شده دست‌نخورده می‌ماند)
            final BroadcastReceiver rx = new BroadcastReceiver() {
              @Override public void onReceive(Context c, Intent i) {
                int s = i.getIntExtra(BluetoothAdapter.EXTRA_STATE, -1);
                if (s == BluetoothAdapter.STATE_ON) begin();
                else if (s == BluetoothAdapter.STATE_TURNING_OFF || s == BluetoothAdapter.STATE_OFF) {
                  stopAll();
                  stopSelf();
                }
              }
            };

            // اگر پروفایلی که کاربر نخواسته وصل شد، فوراً قطع می‌شود
            final BroadcastReceiver rx2 = new BroadcastReceiver() {
              @Override public void onReceive(Context c, Intent i) {
                try {
                  BluetoothDevice d = i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE);
                  if (d == null || i.getIntExtra(BluetoothProfile.EXTRA_STATE, -1) != BluetoothProfile.STATE_CONNECTED) return;
                  boolean isA = BluetoothA2dp.ACTION_CONNECTION_STATE_CHANGED.equals(i.getAction());
                  SharedPreferences sp = getSharedPreferences("bt", MODE_PRIVATE);
                  Set<String> sel = sp.getStringSet("sel", new HashSet<String>());
                  Set<String> allowed = sp.getStringSet(isA ? "m" : "c", new HashSet<String>());
                  String a = d.getAddress();
                  if (sel.contains(a) && !allowed.contains(a)) {
                    BluetoothProfile pr = isA ? a2dp : hfp;
                    if (pr != null) call(pr, "disconnect", d);
                  }
                } catch (Throwable t) { }
              }
            };

            // «پاسخ به تماس (گوشی)»: وقتی صدای تماس (ورودی یا خروجی) به دستگاه بلوتوث می‌رود، از آن گرفته و به گوشی داده می‌شود
            final BroadcastReceiver rx3 = new BroadcastReceiver() {
              @Override public void onReceive(Context c, Intent i) {
                try {
                  BluetoothDevice d = i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE);
                  if (d == null) return;
                  Set<String> ph = getSharedPreferences("bt", MODE_PRIVATE).getStringSet("p", new HashSet<String>());
                  if (!ph.contains(d.getAddress())) return;
                  int st = i.getIntExtra(BluetoothProfile.EXTRA_STATE, -1);
                  AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (st == BluetoothHeadset.STATE_AUDIO_CONNECTED) {
                    try { am.stopBluetoothSco(); am.setBluetoothScoOn(false); } catch (Throwable t) { }
                    if (Build.VERSION.SDK_INT >= 31) {
                      try {
                        for (AudioDeviceInfo ai : am.getAvailableCommunicationDevices()) {
                          if (ai.getType() == AudioDeviceInfo.TYPE_BUILTIN_EARPIECE) { am.setCommunicationDevice(ai); break; }
                        }
                      } catch (Throwable t) { }
                    }
                    if (hfp != null) call(hfp, "disconnect", d);
                  } else if (st == BluetoothHeadset.STATE_AUDIO_DISCONNECTED) {
                    if (Build.VERSION.SDK_INT >= 31) {
                      try { am.clearCommunicationDevice(); } catch (Throwable t) { }
                    }
                  }
                } catch (Throwable t) { }
              }
            };

            @Override public void onCreate() {
              super.onCreate();
              running = true;
              ad = BluetoothAdapter.getDefaultAdapter();
              NotificationManager nm = getSystemService(NotificationManager.class);
              nm.createNotificationChannel(new NotificationChannel("bt", "BT Auto", NotificationManager.IMPORTANCE_LOW));
              Notification n = new Notification.Builder(this, "bt")
                  .setContentTitle("اتصال خودکار بلوتوث فعال است")
                  .setSmallIcon(android.R.drawable.stat_sys_data_bluetooth).build();
              if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE);
              else startForeground(1, n);
              registerReceiver(rx, new IntentFilter(BluetoothAdapter.ACTION_STATE_CHANGED));
              IntentFilter f2 = new IntentFilter();
              f2.addAction(BluetoothA2dp.ACTION_CONNECTION_STATE_CHANGED);
              f2.addAction(BluetoothHeadset.ACTION_CONNECTION_STATE_CHANGED);
              registerReceiver(rx2, f2);
              registerReceiver(rx3, new IntentFilter(BluetoothHeadset.ACTION_AUDIO_STATE_CHANGED));
            }

            @Override public int onStartCommand(Intent i, int f, int id) {
              int st = ad == null ? BluetoothAdapter.STATE_OFF : ad.getState();
              if (st == BluetoothAdapter.STATE_ON) {
                begin();
              } else if (st != BluetoothAdapter.STATE_TURNING_ON) {
                // بلوتوث خاموش است؛ سرویس لازم نیست
                stopAll();
                stopSelf();
              }
              // اگر در حال روشن شدن است، گیرنده rx با STATE_ON کار را شروع می‌کند
              return START_NOT_STICKY;
            }

            @Override public IBinder onBind(Intent i) { return null; }

            @Override public void onDestroy() {
              running = false;
              try { unregisterReceiver(rx); } catch (Exception e) { }
              try { unregisterReceiver(rx2); } catch (Exception e) { }
              try { unregisterReceiver(rx3); } catch (Exception e) { }
              stopAll();
              super.onDestroy();
            }

            void proxies() {
              BluetoothProfile.ServiceListener l = new BluetoothProfile.ServiceListener() {
                @Override public void onServiceConnected(int pf, BluetoothProfile pr) {
                  if (pf == BluetoothProfile.A2DP) a2dp = pr; else if (pf == BluetoothProfile.HEADSET) hfp = pr;
                }
                @Override public void onServiceDisconnected(int pf) {
                  if (pf == BluetoothProfile.A2DP) a2dp = null; else if (pf == BluetoothProfile.HEADSET) hfp = null;
                }
              };
              try {
                if (a2dp == null) ad.getProfileProxy(this, l, BluetoothProfile.A2DP);
                if (hfp == null) ad.getProfileProxy(this, l, BluetoothProfile.HEADSET);
              } catch (Exception e) { }
            }

            void begin() {
              final int g = ++gen;
              proxies();
              new Thread(new Runnable() { @Override public void run() { loop(g); } }).start();
            }

            void loop(int g) {
              for (int i = 0; i < 150 && g == gen; i++) {
                boolean all = true;
                SharedPreferences sp = getSharedPreferences("bt", MODE_PRIVATE);
                Set<String> sel = sp.getStringSet("sel", new HashSet<String>());
                for (String addr : sel) {
                  try {
                    if (!tryConnect(ad.getRemoteDevice(addr), sp)) all = false;
                  } catch (Throwable e) { all = false; }
                }
                if (all && i >= 8) break;
                try { Thread.sleep(i < 6 ? 700 : 3000); } catch (InterruptedException e) { return; }
              }
            }

            boolean hasUuid(BluetoothDevice d, String u) {
              ParcelUuid[] a = d.getUuids();
              if (a == null) return false;
              for (ParcelUuid pu : a) if (pu.toString().toLowerCase().startsWith(u)) return true;
              return false;
            }

            void call(BluetoothProfile pr, String name, BluetoothDevice d) {
              try {
                Method mt = pr.getClass().getDeclaredMethod(name, BluetoothDevice.class);
                mt.setAccessible(true);
                mt.invoke(pr, d);
              } catch (Throwable t) { }
            }

            boolean tryConnect(BluetoothDevice d, SharedPreferences sp) throws Exception {
              String a = d.getAddress();
              BluetoothClass bc = d.getBluetoothClass();
              boolean audio = (bc != null && bc.getMajorDeviceClass() == BluetoothClass.Device.Major.AUDIO_VIDEO)
                  || hasUuid(d, "0000110b") || hasUuid(d, "0000111e") || hasUuid(d, "00001108");
              if (audio) {
                Set<String> m = sp.getStringSet("m", new HashSet<String>());
                Set<String> c = sp.getStringSet("c", new HashSet<String>());
                BluetoothProfile[] ps = { a2dp, hfp };
                boolean[] want = { m.contains(a), c.contains(a) };
                boolean ok = true;
                for (int k = 0; k < 2; k++) {
                  BluetoothProfile pr = ps[k];
                  if (pr == null) { if (want[k]) ok = false; continue; }
                  int st = pr.getConnectionState(d);
                  if (want[k]) {
                    if (st != BluetoothProfile.STATE_CONNECTED) {
                      ok = false;
                      if (st == BluetoothProfile.STATE_DISCONNECTED) call(pr, "connect", d);
                    }
                  } else if (st == BluetoothProfile.STATE_CONNECTED) {
                    ok = false;
                    call(pr, "disconnect", d);
                  }
                }
                return ok;
              }
              BluetoothSocket s = socks.get(a);
              if (s != null && s.isConnected()) return true;
              ad.cancelDiscovery();
              s = d.createRfcommSocketToServiceRecord(SPP);
              try {
                s.connect();
              } catch (Exception e) {
                try { s.close(); } catch (Exception x) { }
                throw e;
              }
              socks.put(a, s);
              return true;
            }

            void stopAll() {
              gen++;
              for (BluetoothSocket s : socks.values()) { try { s.close(); } catch (Exception e) { } }
              socks.clear();
              try {
                if (a2dp != null) ad.closeProfileProxy(BluetoothProfile.A2DP, a2dp);
                if (hfp != null) ad.closeProfileProxy(BluetoothProfile.HEADSET, hfp);
              } catch (Exception e) { }
              a2dp = null;
              hfp = null;
            }
          }
