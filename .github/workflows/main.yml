name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/btauto app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'BtAutoConnect'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.3.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.btauto'
            compileSdk 34
            defaultConfig {
              applicationId 'com.btauto'
              minSdk 26
              targetSdk 34
              versionCode 2
              versionName '1.1'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <application android:label="BT Auto"
                         android:icon="@mipmap/ic_launcher"
                         android:roundIcon="@mipmap/ic_launcher_round"
                         android:theme="@android:style/Theme.DeviceDefault.Light">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".BtService" android:exported="false"
                       android:foregroundServiceType="connectedDevice"/>
              <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#1565C0" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:strokeColor="#FFFFFF" android:strokeWidth="4"
                  android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M33,58 L33,52 A21,21 0 0 1 75,52 L75,58"/>
            <path android:fillColor="#FFFFFF"
                  android:pathData="M31,58 L35,58 Q37,58 37,60 L37,72 Q37,74 35,74 L31,74 Q29,74 29,72 L29,60 Q29,58 31,58 Z"/>
            <path android:fillColor="#FFFFFF"
                  android:pathData="M73,58 L77,58 Q79,58 79,60 L79,72 Q79,74 77,74 L73,74 Q71,74 71,72 L71,60 Q71,58 73,58 Z"/>
            <path android:strokeColor="#82E0FF" android:strokeWidth="3.2"
                  android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M46,48 L62,62 L54,70 L54,38 L62,46 L46,60"/>
          </vector>
          EOF
          for n in ic_launcher ic_launcher_round; do
          cat > app/src/main/res/mipmap-anydpi-v26/$n.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
            <monochrome android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          done
          cat > app/src/main/java/com/btauto/MainActivity.java <<'EOF'
          package com.btauto;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {
            LinearLayout box;
            boolean ready = false;
            Set<String> m = new HashSet<>();
            Set<String> c = new HashSet<>();

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              ScrollView sv = new ScrollView(this);
              box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              box.setPadding(32, 64, 32, 64);
              sv.addView(box);
              setContentView(sv);
              List<String> need = new ArrayList<>();
              if (Build.VERSION.SDK_INT >= 31 && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED)
                need.add(Manifest.permission.BLUETOOTH_CONNECT);
              if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                need.add(Manifest.permission.POST_NOTIFICATIONS);
              if (need.isEmpty()) { ready = true; load(); }
              else requestPermissions(need.toArray(new String[0]), 1);
            }

            @Override protected void onResume() {
              super.onResume();
              if (ready) load();
            }

            @Override public void onRequestPermissionsResult(int rc, String[] p, int[] r) {
              ready = true;
              load();
            }

            void save() {
              Set<String> u = new HashSet<>(m);
              u.addAll(c);
              getSharedPreferences("bt", MODE_PRIVATE).edit()
                  .putStringSet("m", new HashSet<>(m))
                  .putStringSet("c", new HashSet<>(c))
                  .putStringSet("sel", u).apply();
              Intent i = new Intent(this, BtService.class);
              if (u.isEmpty()) stopService(i); else startForegroundService(i);
            }

            CheckBox cb(String text, boolean on, final Set<String> target, final String addr) {
              CheckBox x = new CheckBox(this);
              x.setText(text);
              x.setChecked(on);
              x.setOnCheckedChangeListener((v, checked) -> {
                if (checked) target.add(addr); else target.remove(addr);
                save();
              });
              return x;
            }

            void load() {
              box.removeAllViews();
              SharedPreferences sp = getSharedPreferences("bt", MODE_PRIVATE);
              m = new HashSet<>(sp.getStringSet("m", new HashSet<String>()));
              c = new HashSet<>(sp.getStringSet("c", new HashSet<String>()));
              Set<String> old = sp.getStringSet("sel", new HashSet<String>());
              if (m.isEmpty() && c.isEmpty()) { m.addAll(old); c.addAll(old); }

              TextView t = new TextView(this);
              t.setText("برای هر دستگاه مشخص کنید خودکار برای چه کاری وصل شود. اگر تیک یک گزینه را نزنید، آن کار از طریق گوشی انجام می‌شود (موزیک از بلندگوی گوشی / تماس با گوشی).");
              t.setTextSize(16);
              box.addView(t);

              Button b = new Button(this);
              b.setText("جفت‌سازی دستگاه جدید (تنظیمات بلوتوث)");
              b.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_BLUETOOTH_SETTINGS)));
              box.addView(b);

              try {
                BluetoothAdapter ad = ((BluetoothManager) getSystemService(BLUETOOTH_SERVICE)).getAdapter();
                Set<BluetoothDevice> bonded = ad.getBondedDevices();
                if (bonded.isEmpty()) {
                  TextView e = new TextView(this);
                  e.setText("هنوز دستگاهی جفت نشده است.");
                  box.addView(e);
                }
                for (BluetoothDevice d : bonded) {
                  final String a = d.getAddress();
                  TextView nm = new TextView(this);
                  nm.setText(d.getName() == null ? a : d.getName());
                  nm.setTextSize(17);
                  nm.setTypeface(null, Typeface.BOLD);
                  nm.setPadding(0, 40, 0, 0);
                  box.addView(nm);
                  box.addView(cb("پخش موزیک و صدا", m.contains(a), m, a));
                  box.addView(cb("پاسخ به تماس (هندزفری)", c.contains(a), c, a));
                }
              } catch (SecurityException e) { }
              if (!m.isEmpty() || !c.isEmpty()) save();
            }
          }
          EOF
          cat > app/src/main/java/com/btauto/BootReceiver.java <<'EOF'
          package com.btauto;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import java.util.HashSet;

          public class BootReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              if (!c.getSharedPreferences("bt", Context.MODE_PRIVATE).getStringSet("sel", new HashSet<String>()).isEmpty()) {
                try { c.startForegroundService(new Intent(c, BtService.class)); } catch (Exception e) { }
              }
            }
          }
          EOF
          cat > app/src/main/java/com/btauto/BtService.java <<'EOF'
          package com.btauto;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.bluetooth.BluetoothA2dp;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothClass;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothHeadset;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.BluetoothSocket;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.ParcelUuid;
          import java.lang.reflect.Method;
          import java.util.HashSet;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;

          public class BtService extends Service {
            static final UUID SPP = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
            BluetoothAdapter ad;
            volatile int gen = 0;
            volatile BluetoothProfile a2dp, hfp;
            final Map<String, BluetoothSocket> socks = new ConcurrentHashMap<>();

            final BroadcastReceiver rx = new BroadcastReceiver() {
              @Override public void onReceive(Context c, Intent i) {
                int s = i.getIntExtra(BluetoothAdapter.EXTRA_STATE, -1);
                if (s == BluetoothAdapter.STATE_ON) begin();
                else if (s == BluetoothAdapter.STATE_TURNING_OFF || s == BluetoothAdapter.STATE_OFF) stopAll();
              }
            };

            // اگر پروفایلی که کاربر نخواسته وصل شد، فوراً قطع می‌شود
            final BroadcastReceiver rx2 = new BroadcastReceiver() {
              @Override public void onReceive(Context c, Intent i) {
                try {
                  BluetoothDevice d = i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE);
                  if (d == null || i.getIntExtra(BluetoothProfile.EXTRA_STATE, -1) != BluetoothProfile.STATE_CONNECTED) return;
                  boolean isA = BluetoothA2dp.ACTION_CONNECTION_STATE_CHANGED.equals(i.getAction());
                  SharedPreferences sp = getSharedPreferences("bt", MODE_PRIVATE);
                  Set<String> sel = sp.getStringSet("sel", new HashSet<String>());
                  Set<String> allowed = sp.getStringSet(isA ? "m" : "c", new HashSet<String>());
                  String a = d.getAddress();
                  if (sel.contains(a) && !allowed.contains(a)) {
                    BluetoothProfile p = isA ? a2dp : hfp;
                    if (p != null) call(p, "disconnect", d);
                  }
                } catch (Throwable t) { }
              }
            };

            @Override public void onCreate() {
              super.onCreate();
              ad = BluetoothAdapter.getDefaultAdapter();
              NotificationManager nm = getSystemService(NotificationManager.class);
              nm.createNotificationChannel(new NotificationChannel("bt", "BT Auto", NotificationManager.IMPORTANCE_LOW));
              Notification n = new Notification.Builder(this, "bt")
                  .setContentTitle("اتصال خودکار بلوتوث فعال است")
                  .setSmallIcon(android.R.drawable.stat_sys_data_bluetooth).build();
              if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE);
              else startForeground(1, n);
              registerReceiver(rx, new IntentFilter(BluetoothAdapter.ACTION_STATE_CHANGED));
              IntentFilter f2 = new IntentFilter();
              f2.addAction(BluetoothA2dp.ACTION_CONNECTION_STATE_CHANGED);
              f2.addAction(BluetoothHeadset.ACTION_CONNECTION_STATE_CHANGED);
              registerReceiver(rx2, f2);
            }

            @Override public int onStartCommand(Intent i, int f, int id) {
              if (ad != null && ad.isEnabled()) begin();
              return START_STICKY;
            }

            @Override public IBinder onBind(Intent i) { return null; }

            @Override public void onDestroy() {
              try { unregisterReceiver(rx); } catch (Exception e) { }
              try { unregisterReceiver(rx2); } catch (Exception e) { }
              stopAll();
              super.onDestroy();
            }

            void proxies() {
              BluetoothProfile.ServiceListener l = new BluetoothProfile.ServiceListener() {
                @Override public void onServiceConnected(int p, BluetoothProfile pr) {
                  if (p == BluetoothProfile.A2DP) a2dp = pr; else if (p == BluetoothProfile.HEADSET) hfp = pr;
                }
                @Override public void onServiceDisconnected(int p) {
                  if (p == BluetoothProfile.A2DP) a2dp = null; else if (p == BluetoothProfile.HEADSET) hfp = null;
                }
              };
              try {
                if (a2dp == null) ad.getProfileProxy(this, l, BluetoothProfile.A2DP);
                if (hfp == null) ad.getProfileProxy(this, l, BluetoothProfile.HEADSET);
              } catch (Exception e) { }
            }

            void begin() {
              final int g = ++gen;
              proxies();
              new Thread(new Runnable() { @Override public void run() { loop(g); } }).start();
            }

            void loop(int g) {
              for (int i = 0; i < 150 && g == gen; i++) {
                boolean all = true;
                SharedPreferences sp = getSharedPreferences("bt", MODE_PRIVATE);
                Set<String> sel = sp.getStringSet("sel", new HashSet<String>());
                for (String addr : sel) {
                  try {
                    if (!tryConnect(ad.getRemoteDevice(addr), sp)) all = false;
                  } catch (Throwable e) { all = false; }
                }
                if (all && i >= 8) break;
                try { Thread.sleep(i < 6 ? 500 : 2000); } catch (InterruptedException e) { return; }
              }
            }

            boolean hasUuid(BluetoothDevice d, String u) {
              ParcelUuid[] a = d.getUuids();
              if (a == null) return false;
              for (ParcelUuid p : a) if (p.toString().toLowerCase().startsWith(u)) return true;
              return false;
            }

            void call(BluetoothProfile p, String name, BluetoothDevice d) {
              try {
                Method m = p.getClass().getDeclaredMethod(name, BluetoothDevice.class);
                m.setAccessible(true);
                m.invoke(p, d);
              } catch (Throwable t) { }
            }

            boolean tryConnect(BluetoothDevice d, SharedPreferences sp) throws Exception {
              String a = d.getAddress();
              BluetoothClass bc = d.getBluetoothClass();
              boolean audio = (bc != null && bc.getMajorDeviceClass() == BluetoothClass.Device.Major.AUDIO_VIDEO)
                  || hasUuid(d, "0000110b") || hasUuid(d, "0000111e") || hasUuid(d, "00001108");
              if (audio) {
                Set<String> m = sp.getStringSet("m", new HashSet<String>());
                Set<String> c = sp.getStringSet("c", new HashSet<String>());
                BluetoothProfile[] ps = { a2dp, hfp };
                boolean[] want = { m.contains(a), c.contains(a) };
                boolean ok = true;
                for (int k = 0; k < 2; k++) {
                  BluetoothProfile p = ps[k];
                  if (p == null) { if (want[k]) ok = false; continue; }
                  boolean on = p.getConnectedDevices().contains(d);
                  if (want[k] && !on) { call(p, "connect", d); ok = false; }
                  else if (!want[k] && on) { call(p, "disconnect", d); ok = false; }
                }
                return ok;
              }
              BluetoothSocket s = socks.get(a);
              if (s != null && s.isConnected()) return true;
              ad.cancelDiscovery();
              s = d.createRfcommSocketToServiceRecord(SPP);
              try {
                s.connect();
              } catch (Exception e) {
                try { s.close(); } catch (Exception x) { }
                throw e;
              }
              socks.put(a, s);
              return true;
            }

            void stopAll() {
              gen++;
              for (BluetoothSocket s : socks.values()) { try { s.close(); } catch (Exception e) { } }
              socks.clear();
              try {
                if (a2dp != null) ad.closeProfileProxy(BluetoothProfile.A2DP, a2dp);
                if (hfp != null) ad.closeProfileProxy(BluetoothProfile.HEADSET, hfp);
              } catch (Exception e) { }
              a2dp = null;
              hfp = null;
            }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BtAutoConnect
          path: app/build/outputs/apk/debug/app-debug.apk
